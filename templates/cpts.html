<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Probability Tables</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .cpt-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        .cpt-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }
        .cpt-card h3 {
            margin-bottom: 1rem;
            color: var(--primary);
            font-size: 1.25rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }
        pre {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #334155;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">📊</div>
            <h1>Conditional Probability Tables</h1>
            <p>Analytical view of the learned CPTs</p>
        </header>

        <a href="/" class="back-link">← Back to Dashboard</a>

        <div class="cpt-container">
            {% for cpt in cpts %}
            <div class="cpt-card">
                <h3>Node: {{ cpt.variable }}</h3>
                <pre>{{ cpt.table }}</pre>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
